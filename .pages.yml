media:
  input: assets/img/posts
  output: /assets/img/posts
content:
  - name: posts
    label: Title, Date, Categories, Tags, Content
    path: _posts
    type: collection
    filename: '{year}-{month}-{day}-{primary}.md'
    fields:
      - { name: title, label: 제목, type: string, required: true }
      - { name: date, label: 작성일, type: datetime, format: 'YYYY-MM-DD HH:mm:ss +0800' }
      - { name: categories, label: 카테고리, type: list }
      - { name: tags, label: 태그, type: list }
      - { name: body, label: 본문, type: rich-text }
