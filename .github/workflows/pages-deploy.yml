name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 💡 최신 버전 충돌을 피하기 위해 안정적인 ubuntu-24.04 버전으로 강제 고정합니다.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update Platform and Install Dependencies
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Build Site
        run: JEKYLL_ENV=production bundle exec jekyll b

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04 # 💡 여기도 서버 버전을 똑같이 안전한 버전으로 맞춥니다.
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
